# Deploys this project to Cloudflare Pages on every push to the default branch.
# Idle until the repo variable CLOUDFLARE_ACCOUNT_ID is set (projects may use another host).
# Builds with `bun run build` when package.json has a build script, then uploads DEPLOY_DIR.
name: deploy

on:
  push:

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'public' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            bun install && bun run build
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.DEPLOY_DIR }} --project-name=${{ github.event.repository.name }} --branch=${{ github.event.repository.default_branch }}
